name: ci

# 一条流水线的意义是"别人 clone 下来也能跑出和我一样的数"。
# 本地跑过什么，这里就跑什么；跑不了的（iOS 真编译、真机手感）在注释里写明，不假装验证过。
#
# 为什么安卓 SDK 用 curl 手装而不用第三方 setup action：那个 action 的大版本号一旦改名，
# 这条流水线就会因为"拉不到 action"而红，而那种红和代码没关系。
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  # 安卓侧全套：纯 JVM 模块 + app 单元测试 + 出包。
  # 这三步在 2026-11-02 的本机真跑过：core 2426 条 0 失败（2 跳过）、app 985 条 0 失败、
  # 出包 103,695,204 字节的 app-debug.apk。数是从 test-results/*.xml 现加的，不是抄的。
  # 所以这条 job 红了就是真红了，不是环境差异。
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }

      - name: 装 Android SDK（cmdline-tools + platform 36 + build-tools 36）
        run: |
          set -euo pipefail
          # SDK 不放在检出目录里：ANDROID_HOME 原来等于 ${{ github.workspace }}/android-sdk，
          # 等于往仓库工作树里塞十万个文件，而 core 里有几个测试会遍历仓库根目录。
          export ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # 这条 job 连红四次的真正原因在这里：ubuntu-latest 的镜像自带一个 SDK，并把
          # ANDROID_SDK_ROOT 指向 /usr/local/lib/android/sdk。只改 ANDROID_HOME 的话，
          # AGP 看到两个不同的 SDK 路径就拒绝工作——报的是
          # "Several environment variables ... contain different paths to the SDK"，
          # 而且是在 :app:testDebugUnitTest 解析依赖时，一条测试结果都不会留下。
          # 两个变量必须指同一个目录。
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/licenses"
          curl -fsSL -o /tmp/clt.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d /tmp/clt
          mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          # 许可用本机实际接受过的那两个摘要预置，不用 `yes | sdkmanager --licenses`：
          # 上一版那么写，`yes` 会在 sdkmanager 结束后被 SIGPIPE 打断，
          # 而 set -o pipefail 把它的 141 当成整条流水线的失败——CI 就是这么红的。
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5279c55\n' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          # 这一步上一次"绿"得可疑：整个 job 只跑了 56 秒，装 SDK 只用了 6 秒，
          # 而 gradle 那条 43 秒就红、一条测试结果都没留下（artifact 数为 0）。
          # sdkmanager 在拿不到许可或软件包时可以是 0 退出但不装东西，所以这里不认它的退出码，只认目录。
          test -d "$ANDROID_HOME/platforms/android-36"        || { echo "::error::platforms/android-36 没装上"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/36.0.0"          || { echo "::error::build-tools/36.0.0 没装上"; exit 1; }
          test -x "$ANDROID_HOME/platform-tools/adb"          || { echo "::error::platform-tools(adb) 没装上"; exit 1; }
          echo "已装：$(ls "$ANDROID_HOME/platforms") / $(ls "$ANDROID_HOME/build-tools")"

      # 单独一步：上一条 job 红了 43 秒、一条测试结果都没留下，分不清是 wrapper 拉不到发行版、
      # 依赖解析不了，还是编译本身失败。拆成一步之后，红的名字本身就是答案。
      - name: Gradle 起得来吗（发行版与插件解析）
        run: |
          set -euo pipefail
          # 两个 SDK 变量指不同目录时，AGP 报的不是"哪一步错了"而是"给我看产物都看不出来"，
          # 所以这条先自己查、自己说。
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ "$ANDROID_SDK_ROOT" != "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_SDK_ROOT 与 ANDROID_HOME 指到两个目录，AGP 会直接拒绝构建"
            exit 1
          fi
          ./gradlew --version --console=plain

      - name: 跑测试并出包
        # :app:assembleDebugAndroidTest 在这里只编译、不跑（没有设备）。
        # 加它的原因很具体：androidTest 里"关于页顶上那行是 Mika"那条断言早就和界面不一致了，
        # 而它平时谁也跑不到——至少编译能写错资源 id 这种事挡住。
        run: |
          set -uo pipefail
          if ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
               --stacktrace --console=plain > /tmp/gradle.log 2>&1; then
            tail -6 /tmp/gradle.log
          else
            echo "----- gradle 失败原因（全文在 artifact gradle-log 里）-----"
            sed -n '/What went wrong/,/^\* Try/p' /tmp/gradle.log | head -30
            tail -20 /tmp/gradle.log
            # 红要能自己讲清楚为什么红：日志下载要登录，注释不用。
            # 这里取"What went wrong"那一段压成一行写成 ::error::，Actions 页面和公开 API 都能读到。
            reason=$(sed -n '/What went wrong/,/^\* Try/p' /tmp/gradle.log \
              | tr -d '\r' | tr '\n' ' ' | tr -s ' ' | cut -c1-360 | sed 's/%/%25/g')
            [ -n "$reason" ] || reason=$(tail -3 /tmp/gradle.log | tr '\n' ' ' | cut -c1-360 | sed 's/%/%25/g')
            echo "::error::${reason}"
            exit 1
          fi

      # 红的时候报告比日志有用：直接下 artifact 看是哪条断言。
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/test-results
            app/build/test-results
          if-no-files-found: ignore

      # 构建日志失败时也留一份：上面那行 ::error:: 只有 360 字，全文得靠这个。
      - name: 上传 gradle 输出
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  # 出处核对：UPSTREAM.md 承诺"和上游 diff 出来只有表里那些文件"，那就每天真 diff 一次。
  # 这一步只打印，不判定——判定标准是人写的差异表，机器不替人更新它。
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 与上游 0b57e35d 逐文件比对
        run: |
          git clone --depth 1 https://github.com/mylea1/phongent.git /tmp/upstream
          echo "--- 本仓库相对上游的差异（应与 UPSTREAM.md 的表一致）---"
          diff -rq -x .git /tmp/upstream "$GITHUB_WORKSPACE" | sed "s|$GITHUB_WORKSPACE|.|" || true

  # iOS：真编译。语法级检查在下面那条里，那条看不见"符号根本没参与编译"和类型错误——
  # FleetPalette.swift 漏挂进工程那两次就都是 parse 全绿、真编译必红的。
  #
  # macos-15 镜像上默认是 Xcode 16.4，这里显式切到 26.3：Liquid Glass 的 API 只随 Xcode 26 的 SDK 提供，
  # 而 FleetPalette.swift 里那段是 #if compiler(>=6.2) 圈住的——不切过去就只会编到回退分支，
  # 我新写的那一半等于没编译过。
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 选 Xcode 26.3
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: 工程里有哪几个 scheme
        run: xcodebuild -project ios/MikaRemote.xcodeproj -list

      - name: 编 App 与 Widget 扩展（模拟器，不签名）
        run: |
          set -uo pipefail
          # DEVELOPMENT_TEAM 清空：project.yml 里那个 Y726TUG6G3 是上游作者的签名团队。
          if xcodebuild -project ios/MikaRemote.xcodeproj -scheme MikaRemote \
               -destination 'generic/platform=iOS Simulator' -configuration Debug \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
               build > /tmp/xcodebuild.log 2>&1; then
            tail -4 /tmp/xcodebuild.log
          else
            grep -E "error:|fatal error" /tmp/xcodebuild.log | head -12
            reason=$(grep -m1 -E "error:|fatal error" /tmp/xcodebuild.log | cut -c1-360 | sed 's/%/%25/g')
            [ -n "$reason" ] || reason=$(tail -2 /tmp/xcodebuild.log | tr '\n' ' ' | cut -c1-360 | sed 's/%/%25/g')
            echo "::error::iOS 编译失败：${reason}"
            exit 1
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore

  # 只到语法解析的一条独立检查：它比上面那条便宜，且 macos-14 上就能跑。
  #
  # 另外记一笔真实的坑：液态玻璃的 API 只随 Xcode 26 的 SDK 提供。
  # FleetPalette.swift 里那段用 #if compiler(>=6.2) 圈住了——
  # 不然旧 Xcode 连 `glassEffect` 这个名字都不认识，整包直接编译失败，
  # 而 `#available(iOS 26, *)` 那种运行时分支救不了编译期。
  ios-syntax:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 全部 Swift 文件语法解析
        run: |
          set -euo pipefail
          n=0
          for f in $(find ios -name '*.swift'); do
            swiftc -parse -target arm64-apple-ios17.0 "$f" || { echo "!! 解析失败: $f"; exit 1; }
            n=$((n + 1))
          done
          echo "OK：$n 个 Swift 文件解析通过（语法级，不等于类型检查通过）"
